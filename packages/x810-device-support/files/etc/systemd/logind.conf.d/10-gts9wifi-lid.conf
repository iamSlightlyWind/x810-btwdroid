#
# Lid/cover suspend remains opt-in until wake behavior is validated. Explicit
# suspend is available from GNOME and defaults to s2idle via sleep.conf.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HoldoffTimeoutSec=0
