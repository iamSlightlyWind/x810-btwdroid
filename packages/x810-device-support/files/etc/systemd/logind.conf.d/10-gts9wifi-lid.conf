#
# Deep suspend has failed to resume reliably on this X810 port, including a
# UFS PHY timeout that remounted linuxroot read-only. Keep lid close ignored;
# system sleep targets are masked separately so desktop-initiated sleep is
# blocked too until the wake path is fixed.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HoldoffTimeoutSec=0
