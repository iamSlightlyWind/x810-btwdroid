name: X810 Arch build and release

on:
  push:
    branches: [main]
    paths:
      - "PORT_VERSION"
      - "README.md"
      - "LICENSE"
      - "rootfs/**"
      - "docs/**"
      - "packages/**"
      - "tools/**"
      - ".gitignore"
      - ".github/workflows/x810-arch.yml"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild and republish the current release even when its source commit is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

env:
  KVER: 7.2.0-gts9wifi

concurrency:
  group: x810-arch-build-release
  cancel-in-progress: false

jobs:
  # The public updater is tied to the successful push run ID. Manual rebuilds
  # reuse that identity only when every release input is unchanged.
  publication_identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      run_number: ${{ steps.identity.outputs.run_number }}
      commit: ${{ steps.identity.outputs.commit }}
      branch: ${{ steps.identity.outputs.branch }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve a compatible publication identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            run_id="$GITHUB_RUN_ID"
            run_number="$GITHUB_RUN_NUMBER"
            commit="$GITHUB_SHA"
            branch="$GITHUB_REF_NAME"
          else
            run_data="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/x810-arch.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | max_by(.run_number) | [.id, .run_number, .head_sha, .head_branch] | @tsv')"
            IFS=$'\t' read -r run_id run_number commit branch <<< "$run_data"
            [[ "$run_id" =~ ^[0-9]+$ && "$run_number" =~ ^[0-9]+$ && \
               "$commit" =~ ^[0-9a-f]{40,64}$ && "$branch" == main ]] || {
              echo "No successful main-branch push build is available for this manual run." >&2
              exit 1
            }
            # Manual runs refresh an aggregate only if all release-affecting
            # source is identical to its successful push identity.
            git diff --quiet "$commit" "$GITHUB_SHA" -- \
              PORT_VERSION README.md LICENSE rootfs docs packages tools .gitignore .github/workflows/x810-arch.yml || {
              echo "Release inputs changed since the last successful push. Push and complete the normal build before running a manual rebuild." >&2
              exit 1
            }
          fi
          {
            echo "run_id=$run_id"
            echo "run_number=$run_number"
            echo "commit=$commit"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

  # The in-OS support package and the full bootable image are separate jobs in
  # this one workflow. They run independently, so a userspace fix does not wait
  # for the rootfs build. The support ZIP is a short-lived Actions artifact
  # until the final job publishes the one complete GitHub release.
  build_port_update:
    needs: [publication_identity, plan]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.reuse_release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PODMAN_ROOT_OVERRIDE: /tmp/x810-arch-package-root
      PODMAN_RUNROOT_OVERRIDE: /tmp/x810-arch-package-run
      X810_BUILDER_PACMAN_CACHE_DIR: ${{ github.workspace }}/cache/builder-pacman
      BUILD_RUN_ID: ${{ needs.publication_identity.outputs.run_id }}
      BUILD_RUN_NUMBER: ${{ needs.publication_identity.outputs.run_number }}
      BUILD_COMMIT: ${{ needs.publication_identity.outputs.commit }}
      BUILD_BRANCH: ${{ needs.publication_identity.outputs.branch }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Arch builder package cache
        id: restore_port_builder_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/builder-pacman
          key: x810-arch-builder-pacman-port-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: x810-arch-builder-pacman-port-${{ runner.arch }}-

      - name: Restore makepkg source cache
        id: restore_port_sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/makepkg/sources
          key: x810-makepkg-port-${{ runner.arch }}-${{ hashFiles('packages/**/PKGBUILD') }}-v1
          restore-keys: x810-makepkg-port-${{ runner.arch }}-

      - name: Install Arch package build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman zstd

      - name: Run installer, package, rootfs, kernel and release contract tests
        run: |
          set -euo pipefail
          bash -n tools/*.sh rootfs/*.sh
          python3 -m compileall -q tools
          python3 tools/test-x810-install.py
          python3 tools/test-installer-common.py
          python3 tools/test-fetch-x810-kernel.py
          python3 tools/test-target-pacman-policy.py
          python3 tools/test-rootfs-image-profile.py
          python3 tools/test-verify-rootfs-archive.py
          python3 tools/test-tab-companion-overlay.py
          python3 tools/test-arch-port-release.py
          python3 tools/test-x810-workflow.py

      - name: Stage port version and this push's build identity
        run: |
          set -euo pipefail
          port_version="$(tr -d '\r\n ' < PORT_VERSION)"
          [[ "$port_version" =~ ^(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})$ ]]
          python3 - "$port_version" packages/x810-device-support/files/usr/share/tab-companion/port.json <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version, path = sys.argv[1:]
          port = json.loads(Path(path).read_text(encoding="utf-8"))
          if not re.fullmatch(r"(?:0|[1-9][0-9]{0,19})\.(?:0|[1-9][0-9]{0,19})\.(?:0|[1-9][0-9]{0,19})", version):
              raise SystemExit("PORT_VERSION must be numeric MAJOR.MINOR.PATCH")
          if port.get("version") != version or port.get("port_id") != "x810-arch":
              raise SystemExit("PORT_VERSION and Arch Tab Companion metadata disagree")
          PY
          python3 tools/write-arch-port-build-info.py packages/x810-device-support/files/usr/share/tab-companion/port-build.json "$port_version" "$BUILD_RUN_ID" "$BUILD_RUN_NUMBER" "$BUILD_COMMIT" "$BUILD_BRANCH"
          echo "PORT_VERSION=$port_version" >> "$GITHUB_ENV"

      - name: Build the Arch support packages
        id: build_packages
        run: |
          set -euo pipefail
          tools/build-builder-image.sh
          tools/build-packages.sh
          mkdir -p _ci/packages _ci/update
          package_count="$(find out/packages -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)"
          [[ "$package_count" -eq 3 ]] || { echo "Expected exactly three Arch packages, found $package_count." >&2; exit 1; }
          for name in x810-device-support tab-companion brave-bin; do
            count="$(find out/packages -maxdepth 1 -type f -name "$name-*.pkg.tar.zst" | wc -l)"
            [[ "$count" -eq 1 ]] || { echo "Expected exactly one $name package, found $count." >&2; exit 1; }
          done
          for package in out/packages/*.pkg.tar.zst; do
            filename="${package##*/}"
            # GitHub artifacts reject colons in paths; Brave uses a pacman epoch.
            cp -- "$package" "_ci/packages/${filename//:/_}"
          done
          (cd _ci/packages && sha256sum ./*.pkg.tar.zst > SHA256SUMS)
          cp -- packages/x810-device-support/files/usr/share/tab-companion/port-build.json _ci/packages/port-build.json

      - name: Finalize Arch builder and makepkg caches
        id: finalize_port_caches
        if: ${{ always() && !cancelled() && steps.build_packages.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          builder_cache="$GITHUB_WORKSPACE/cache/builder-pacman"
          source_cache="$GITHUB_WORKSPACE/work/makepkg/sources"
          mkdir -p "$builder_cache" "$source_cache"
          sudo chown -R "$(id -u):$(id -g)" "$builder_cache" "$source_cache"
          find "$builder_cache" "$source_cache" -type f \( -name '*.part' -o -name '*.tmp' \) -delete
          if find "$builder_cache" -type f -name '*.pkg.tar.*' -print -quit | grep -q .; then
            echo "has_builder_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_builder_cache=false" >> "$GITHUB_OUTPUT"
          fi
          if find "$source_cache" -type f -print -quit | grep -q .; then
            echo "has_source_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Arch builder package cache
        if: ${{ always() && !cancelled() && steps.restore_port_builder_cache.outputs.cache-hit != 'true' && steps.finalize_port_caches.outcome == 'success' && steps.finalize_port_caches.outputs.has_builder_cache == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/builder-pacman
          key: x810-arch-builder-pacman-port-${{ runner.arch }}-${{ github.run_id }}

      - name: Save makepkg source cache
        if: ${{ always() && !cancelled() && steps.restore_port_sources.outputs.cache-hit != 'true' && steps.finalize_port_caches.outcome == 'success' && steps.finalize_port_caches.outputs.has_source_cache == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/makepkg/sources
          key: x810-makepkg-port-${{ runner.arch }}-${{ hashFiles('packages/**/PKGBUILD') }}-v1
      - name: Build the Tab Companion updater bundle
        run: |
          set -euo pipefail
          (cd _ci/packages && sha256sum --check SHA256SUMS)
          support_package="$(find _ci/packages -maxdepth 1 -type f -name 'x810-device-support-*.pkg.tar.zst' -print -quit)"
          [[ -n "$support_package" && -s _ci/packages/port-build.json ]]
          mkdir -p _ci/update
          python3 tools/make-arch-port-update-bundle.py \
            --package "$support_package" \
            --build-info _ci/packages/port-build.json \
            --output _ci/update/update.zip

      - name: Hand the updater ZIP to the aggregate release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: x810-port-update
          path: _ci/update/update.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  plan:
    needs: publication_identity
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publication_run_id: ${{ needs.publication_identity.outputs.run_id }}
      publication_run_number: ${{ needs.publication_identity.outputs.run_number }}
      source_commit: ${{ needs.publication_identity.outputs.commit }}
      branch: ${{ needs.publication_identity.outputs.branch }}
      port_version: ${{ steps.plan.outputs.port_version }}
      reuse_release: ${{ steps.plan.outputs.reuse_release }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run lightweight planner and rootfs integrity tests
        run: |
          set -euo pipefail
          python3 tools/test-x810-install.py
          python3 tools/test-installer-common.py
          python3 tools/test-rootfs-image-profile.py
          python3 tools/test-verify-rootfs-archive.py

      - name: Validate pinned bootstrap and plan the full release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.publication_identity.outputs.commit }}
          PUBLICATION_RUN_ID: ${{ needs.publication_identity.outputs.run_id }}
          PORT_VERSION_INPUT: ""
          FORCE_REBUILD: ${{ inputs.rebuild || false }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]] || {
            echo "Publication identity does not match the checked-out source commit." >&2
            exit 1
          }
          port_version="$PORT_VERSION_INPUT"
          if [ -z "$port_version" ]; then port_version="$(tr -d '\r\n ' < PORT_VERSION)"; fi
          [[ "$port_version" =~ ^(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})$ ]]
          python3 - "$port_version" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lock = {}
          for number, raw in enumerate(Path("docs/ALARM-ROOTFS.lock").read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              key, separator, value = line.partition("=")
              if not separator or key in lock:
                  raise SystemExit(f"invalid or duplicate bootstrap lock entry on line {number}")
              lock[key] = value
          required = {
              "source_url", "signature_url", "archive_path", "signature_path",
              "archive_size_bytes", "archive_sha256", "signature_size_bytes", "signature_sha256",
              "signer_fingerprint", "keyring_member",
          }
          missing = sorted(key for key in required if not lock.get(key))
          if missing:
              raise SystemExit("ALARM-ROOTFS.lock is incomplete: " + ", ".join(missing))
          port = json.loads(Path("packages/x810-device-support/files/usr/share/tab-companion/port.json").read_text(encoding="utf-8"))
          if port.get("version") != version or port.get("port_id") != "x810-arch":
              raise SystemExit("PORT_VERSION does not match the Arch Tab Companion metadata")
          print("Pinned Arch Linux ARM bootstrap and port update version are valid.")
          PY
          release_tag="x810-arch-build-$PUBLICATION_RUN_ID"
          [[ "$release_tag" =~ ^x810-arch-build-[0-9]+$ ]]
          reuse_release=false
          if [[ "$FORCE_REBUILD" != true ]]; then
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [[ "$latest_tag" == "$release_tag" ]]; then
              check_dir="$RUNNER_TEMP/arch-release-reuse-$GITHUB_RUN_ID"
              mkdir -p "$check_dir"
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$latest_tag" \
                    > "$check_dir/github-release.json" 2>/dev/null && \
                 gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --dir "$check_dir" \
                    --pattern manifest.json --pattern SHA256SUMS >/dev/null 2>&1; then
                if python3 - "$check_dir/manifest.json" "$check_dir/github-release.json" \
                    "$check_dir/SHA256SUMS" "$release_tag" "$SOURCE_COMMIT" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          manifest_path, release_path, sums_path, tag, commit = sys.argv[1:]
          manifest_file, release_file, sums_file = map(Path, (manifest_path, release_path, sums_path))
          manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
          release = json.loads(release_file.read_text(encoding="utf-8"))
          if (not isinstance(manifest, dict) or isinstance(manifest.get("schema_version"), bool)
                  or manifest.get("schema_version") != 1
                  or manifest.get("type") != "x810-arch-release"
                  or manifest.get("release_tag") != tag
                  or manifest.get("source_commit") != commit
                  or manifest.get("device") != {"model": "SM-X810", "codename": "gts9pwifi"}
                  or manifest.get("os") != {"id": "archarm", "arch": "aarch64"}):
              raise SystemExit(1)
          if (release.get("tag_name") != tag or release.get("draft") is not False
                  or release.get("prerelease") is not False):
              raise SystemExit(1)
          if not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("build_inputs_key", ""))):
              raise SystemExit(1)
          kernel = manifest.get("kernel")
          boot = kernel.get("boot_images") if isinstance(kernel, dict) else None
          expected_sizes = {"boot": 100663296, "init_boot": 8388608,
                            "vendor_boot": 100663296, "dtbo": 16777216}
          if not isinstance(boot, dict) or set(boot) != set(expected_sizes):
              raise SystemExit(1)
          for name, size in expected_sizes.items():
              record = boot.get(name)
              if (not isinstance(record, dict) or record.get("size_bytes") != size
                      or not re.fullmatch(r"[0-9a-f]{64}", str(record.get("sha256", "")))):
                  raise SystemExit(1)
          assets = manifest.get("assets")
          if (not isinstance(assets, list) or len(assets) != 2
                  or any(not isinstance(item, dict) for item in assets)
                  or {item.get("name") for item in assets} != {"rootfs.tar.zst", "update.zip"}):
              raise SystemExit(1)
          records = {item["name"]: item for item in assets}
          rootfs = manifest.get("rootfs")
          updater = manifest.get("port_update")
          if (not isinstance(rootfs, dict) or rootfs.get("archive") != "rootfs.tar.zst"
                  or not isinstance(updater, dict) or updater.get("archive") != "update.zip"):
              raise SystemExit(1)
          if any(not isinstance(record.get("size_bytes"), int)
                 or isinstance(record.get("size_bytes"), bool)
                 or record["size_bytes"] <= 0
                 or not re.fullmatch(r"[0-9a-f]{64}", str(record.get("sha256", "")))
                 for record in records.values()):
              raise SystemExit(1)

          api_assets = release.get("assets")
          expected_names = {"rootfs.tar.zst", "manifest.json", "SHA256SUMS", "update.zip"}
          if (not isinstance(api_assets, list) or len(api_assets) != len(expected_names)
                  or any(not isinstance(item, dict) for item in api_assets)):
              raise SystemExit(1)
          api_by_name = {item.get("name"): item for item in api_assets}
          if set(api_by_name) != expected_names:
              raise SystemExit(1)
          for name, api_asset in api_by_name.items():
              digest = api_asset.get("digest")
              if (not isinstance(api_asset.get("size"), int) or isinstance(api_asset.get("size"), bool)
                      or api_asset["size"] <= 0 or not isinstance(digest, str)
                      or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest)):
                  raise SystemExit(1)
          for name, path in (("manifest.json", manifest_file), ("SHA256SUMS", sums_file)):
              if (path.is_symlink() or not path.is_file()
                      or path.stat().st_size != api_by_name[name]["size"]
                      or hashlib.sha256(path.read_bytes()).hexdigest() != api_by_name[name]["digest"][7:]):
                  raise SystemExit(1)

          sums = {}
          for line in sums_file.read_text(encoding="ascii").splitlines():
              fields = line.split(maxsplit=1)
              if len(fields) != 2 or not re.fullmatch(r"[0-9a-f]{64}", fields[0]):
                  raise SystemExit(1)
              sums[fields[1].lstrip("* ")] = fields[0]
          if set(sums) != {"rootfs.tar.zst", "update.zip"}:
              raise SystemExit(1)
          for name, record in records.items():
              api_asset = api_by_name[name]
              if (api_asset.get("size") != record.get("size_bytes")
                      or api_asset.get("digest") != "sha256:" + str(record.get("sha256", ""))
                      or sums.get(name) != record.get("sha256")):
                  raise SystemExit(1)
          if (rootfs.get("size_bytes") != records["rootfs.tar.zst"].get("size_bytes")
                  or rootfs.get("sha256") != records["rootfs.tar.zst"].get("sha256")
                  or updater.get("size_bytes") != records["update.zip"].get("size_bytes")
                  or updater.get("sha256") != records["update.zip"].get("sha256")):
              raise SystemExit(1)
          PY
                then
                  reuse_release=true
                fi
              fi
            fi
          fi
          {
            echo "release_tag=$release_tag"
            echo "port_version=$port_version"
            echo "reuse_release=$reuse_release"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### X810 Arch release plan"
            echo "- Port version: \`$port_version\`; update bundle and rootfs are separate build stages."
            if [[ "$reuse_release" == true ]]; then
              echo "- Complete release: inputs and checksums match the latest published release; **reuse \`$release_tag\` and skip every build**."
            else
              echo "- Complete release: no verified match (or rebuild requested); build the updater and rootfs."
              echo "- Rootfs: rebuild from the pinned Arch Linux ARM bootstrap because Arch repositories are rolling."
            fi
            echo "- Kernel modules: resolve and verify the exact X810 module tree from the public kernel release."
            echo "- Release tag: \`$release_tag\` (keyed to the successful push identity for Tab Companion)."
          } >> "$GITHUB_STEP_SUMMARY"

  # The existing device boot chain supplies the kernel. This stage mirrors
  # The kernel component stage resolves and hands off its exact
  # verified module artifact; it does not build or flash a kernel.
  prepare_kernel_modules:
    needs: plan
    if: needs.plan.outputs.reuse_release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kernel RPM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpio rpm

      - name: Download and verify the public X810 kernel RPM
        run: |
          set -euo pipefail
          python3 tools/fetch-x810-kernel.py --receipt cache/public-kernel/kernel.json
          python3 tools/fetch-x810-kernel.py --receipt cache/public-kernel/kernel.json --verify-prepared
          mkdir -p _ci/kernel
          cp cache/public-kernel/kernel.json _ci/kernel/kernel.json
          tar -C cache/public-kernel/usr/lib/modules -czf _ci/kernel/modules.tar.gz "$KVER"
          tar -C cache/public-kernel -czf _ci/kernel/boot-images.tar.gz boot
          (cd _ci/kernel && sha256sum kernel.json modules.tar.gz boot-images.tar.gz > SHA256SUMS)

      - name: Hand the verified module artifact to the rootfs job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: x810-arch-kernel-modules
          path: _ci/kernel/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  resolve_rootfs:
    needs: [plan, prepare_kernel_modules]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.reuse_release != 'true' &&
      needs.prepare_kernel_modules.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      rootfs_key: ${{ steps.resolve.outputs.rootfs_key }}
      rootfs_tag: ${{ steps.resolve.outputs.rootfs_tag }}
      build_rootfs: ${{ steps.resolve.outputs.build_rootfs }}
    steps:
      - name: Check out sources for release input verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified X810 kernel module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: x810-arch-kernel-modules
          path: _ci/kernel

      - name: Verify artifacts and resolve rootfs build identity
        id: resolve
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          set -euo pipefail
          (cd _ci/kernel && sha256sum --check SHA256SUMS)
          python3 - _ci/kernel/kernel.json <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (receipt.get("schema_version") != 1
                  or receipt.get("repository") != "iamSlightlyWind/x810-fedroid"
                  or receipt.get("kernel_release") != "7.2.0-gts9wifi"
                  or not re.fullmatch(r"[0-9a-f]{40,64}", str(receipt.get("source_commit", "")))):
              raise SystemExit("kernel input receipt does not identify a verified X810 release")
          if not re.fullmatch(r"[0-9a-f]{64}", str(receipt.get("kernel_rpm", {}).get("sha256", ""))):
              raise SystemExit("kernel RPM digest is missing from the receipt")
          if not re.fullmatch(r"[0-9a-f]{64}", str(receipt.get("modules", {}).get("sha256", ""))):
              raise SystemExit("kernel module digest is missing from the receipt")
          PY
          kernel_receipt_digest="$(sha256sum _ci/kernel/kernel.json | awk '{print $1}')"
          bootstrap_lock_digest="$(sha256sum docs/ALARM-ROOTFS.lock | awk '{print $1}')"
          # The immutable source commit covers package recipes and pinned source
          # revisions; the rootfs job independently builds those packages.
          rootfs_key="$(printf '%s\n%s\n%s\n' "$SOURCE_COMMIT" "$kernel_receipt_digest" "$bootstrap_lock_digest" | sha256sum | awk '{print $1}')"
          [[ "$rootfs_key" =~ ^[0-9a-f]{64}$ ]]
          echo "rootfs_key=$rootfs_key" >> "$GITHUB_OUTPUT"
          echo "rootfs_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "build_rootfs=true" >> "$GITHUB_OUTPUT"
          kernel_tag="$(python3 -c 'import json; print(json.load(open("_ci/kernel/kernel.json", encoding="utf-8"))["release_tag"])')"
          {
            echo "### Resolved Arch rootfs inputs"
            echo "- Rootfs key: \`$rootfs_key\` (source commit including package recipes, kernel receipt and signed bootstrap lock; rolling repository transaction is intentionally not claimed reproducible)."
            echo "- Rootfs action: **build** \`$RELEASE_TAG\`."
            echo "- Matching X810 kernel modules: \`$kernel_tag\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build_rootfs:
    needs: [plan, prepare_kernel_modules, resolve_rootfs]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.reuse_release != 'true' &&
      needs.prepare_kernel_modules.result == 'success' &&
      needs.resolve_rootfs.result == 'success' &&
      needs.resolve_rootfs.outputs.build_rootfs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PODMAN_ROOT_OVERRIDE: /tmp/x810-arch-rootfs-root
      PODMAN_RUNROOT_OVERRIDE: /tmp/x810-arch-rootfs-run
      X810_BUILDER_PACMAN_CACHE_DIR: ${{ github.workspace }}/cache/builder-pacman
      X810_PACMAN_CACHE_DIR: ${{ github.workspace }}/cache/rootfs-pacman
      X810_RELEASE_TAG: ${{ needs.resolve_rootfs.outputs.rootfs_tag }}
      X810_BUILD_INPUTS_KEY: ${{ needs.resolve_rootfs.outputs.rootfs_key }}
      X810_PREBUILT_KERNEL_MODULES: "1"
    steps:
      - name: Check out rootfs sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned Arch Linux ARM bootstrap
        id: restore_bootstrap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache/ArchLinuxARM-aarch64-latest.tar.gz
            cache/ArchLinuxARM-aarch64-latest.tar.gz.sig
          key: x810-alarm-bootstrap-${{ runner.arch }}-${{ hashFiles('docs/ALARM-ROOTFS.lock') }}-v1

      - name: Restore Arch builder package cache
        id: restore_rootfs_builder_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/builder-pacman
          key: x810-arch-builder-pacman-rootfs-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: x810-arch-builder-pacman-rootfs-${{ runner.arch }}-

      - name: Restore rolling rootfs package cache
        id: restore_rootfs_pacman_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/rootfs-pacman
          key: x810-arch-rootfs-pacman-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: x810-arch-rootfs-pacman-${{ runner.arch }}-

      - name: Restore rootfs makepkg source cache
        id: restore_rootfs_sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/makepkg/sources
          key: x810-makepkg-rootfs-${{ runner.arch }}-${{ hashFiles('packages/**/PKGBUILD') }}-v1
          restore-keys: x810-makepkg-rootfs-${{ runner.arch }}-

      - name: Install rootfs build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman zstd gnupg cpio rpm
          command -v rpm2cpio

      - name: Fetch and verify the pinned Arch Linux ARM bootstrap
        run: |
          set -euo pipefail
          python3 tools/fetch-alarm-rootfs.py
          tools/verify-alarm-rootfs.sh

      - name: Save pinned Arch Linux ARM bootstrap cache
        if: ${{ success() && steps.restore_bootstrap.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache/ArchLinuxARM-aarch64-latest.tar.gz
            cache/ArchLinuxARM-aarch64-latest.tar.gz.sig
          key: x810-alarm-bootstrap-${{ runner.arch }}-${{ hashFiles('docs/ALARM-ROOTFS.lock') }}-v1

      - name: Download the exact X810 kernel module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: x810-arch-kernel-modules
          path: _ci/kernel

      - name: Verify and stage the exact upstream kernel-module artifact
        run: |
          set -euo pipefail
          (cd _ci/kernel && sha256sum --check SHA256SUMS)
          mkdir -p cache/public-kernel/usr/lib/modules
          cp -- _ci/kernel/kernel.json cache/public-kernel/kernel.json
          tar -xzf _ci/kernel/modules.tar.gz -C cache/public-kernel/usr/lib/modules
          tar -xzf _ci/kernel/boot-images.tar.gz -C cache/public-kernel
          python3 tools/fetch-x810-kernel.py --verify-prepared

      - name: Stage publication identity for the rootfs package build
        env:
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          BUILD_RUN_ID: ${{ needs.plan.outputs.publication_run_id }}
          BUILD_RUN_NUMBER: ${{ needs.plan.outputs.publication_run_number }}
          BUILD_COMMIT: ${{ needs.plan.outputs.source_commit }}
          BUILD_BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          set -euo pipefail
          python3 tools/write-arch-port-build-info.py \
            packages/x810-device-support/files/usr/share/tab-companion/port-build.json \
            "$PORT_VERSION" "$BUILD_RUN_ID" "$BUILD_RUN_NUMBER" "$BUILD_COMMIT" "$BUILD_BRANCH"

      - name: Build and audit the complete Arch GNOME rootfs
        id: build_rootfs_image
        run: rootfs/build-rootfs.sh

      - name: Finalize Arch rootfs caches after build attempt
        id: finalize_rootfs_caches
        if: ${{ always() && !cancelled() && steps.build_rootfs_image.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          builder_cache="$GITHUB_WORKSPACE/cache/builder-pacman"
          pacman_cache="$GITHUB_WORKSPACE/cache/rootfs-pacman"
          source_cache="$GITHUB_WORKSPACE/work/makepkg/sources"
          mkdir -p "$builder_cache" "$pacman_cache" "$source_cache"
          sudo chown -R "$(id -u):$(id -g)" "$builder_cache" "$pacman_cache" "$source_cache"
          find "$builder_cache" "$pacman_cache" "$source_cache" -type f \( -name '*.part' -o -name '*.tmp' \) -delete
          if find "$builder_cache" -type f -name '*.pkg.tar.*' -print -quit | grep -q .; then
            echo "has_builder_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_builder_cache=false" >> "$GITHUB_OUTPUT"
          fi
          if find "$pacman_cache" -type f -name '*.pkg.tar.*' -print -quit | grep -q .; then
            echo "has_pacman_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pacman_cache=false" >> "$GITHUB_OUTPUT"
          fi
          if find "$source_cache" -type f -print -quit | grep -q .; then
            echo "has_source_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Arch builder package cache
        if: ${{ always() && !cancelled() && steps.restore_rootfs_builder_cache.outputs.cache-hit != 'true' && steps.finalize_rootfs_caches.outcome == 'success' && steps.finalize_rootfs_caches.outputs.has_builder_cache == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/builder-pacman
          key: x810-arch-builder-pacman-rootfs-${{ runner.arch }}-${{ github.run_id }}

      - name: Save rolling rootfs package cache
        if: ${{ always() && !cancelled() && steps.restore_rootfs_pacman_cache.outputs.cache-hit != 'true' && steps.finalize_rootfs_caches.outcome == 'success' && steps.finalize_rootfs_caches.outputs.has_pacman_cache == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/rootfs-pacman
          key: x810-arch-rootfs-pacman-${{ runner.arch }}-${{ github.run_id }}

      - name: Save rootfs makepkg source cache
        if: ${{ always() && !cancelled() && steps.restore_rootfs_sources.outputs.cache-hit != 'true' && steps.finalize_rootfs_caches.outcome == 'success' && steps.finalize_rootfs_caches.outputs.has_source_cache == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/makepkg/sources
          key: x810-makepkg-rootfs-${{ runner.arch }}-${{ hashFiles('packages/**/PKGBUILD') }}-v1

      - name: Checksum the verified rootfs release assets
        run: |
          set -euo pipefail
          test -s out/rootfs.tar.zst
          test -s out/manifest.json
          test -s out/SHA256SUMS
          (cd out && sha256sum --check SHA256SUMS)

      - name: Hand the rootfs release set to the aggregate publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: x810-arch-rootfs
          path: |
            out/rootfs.tar.zst
            out/manifest.json
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish_full_set:
    needs: [plan, build_port_update, prepare_kernel_modules, resolve_rootfs, build_rootfs]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.build_port_update.result == 'success' &&
      needs.plan.outputs.reuse_release != 'true' &&
      needs.prepare_kernel_modules.result == 'success' &&
      needs.resolve_rootfs.result == 'success' &&
      needs.build_rootfs.result == 'success' &&
      needs.resolve_rootfs.outputs.build_rootfs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release assembly and verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rootfs archive verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd

      - name: Download the rootfs artifact from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: x810-arch-rootfs
          path: _ci/release

      - name: Download the updater ZIP from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: x810-port-update
          path: _ci/update

      - name: Validate, assemble, and publish the complete Arch release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ needs.plan.outputs.release_tag }}
          EXPECTED_INPUT_KEY: ${{ needs.resolve_rootfs.outputs.rootfs_key }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          SOURCE_BRANCH: ${{ needs.plan.outputs.branch }}
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          PUBLICATION_RUN_ID: ${{ needs.plan.outputs.publication_run_id }}
          PUBLICATION_RUN_NUMBER: ${{ needs.plan.outputs.publication_run_number }}
          PORT_UPDATE_ZIP: _ci/update/update.zip
        run: bash tools/publish-arch-full-set.sh

  prune_old_releases:
    needs: [publication_identity, plan, build_port_update, prepare_kernel_modules, resolve_rootfs, build_rootfs, publish_full_set]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Keep only the newest complete aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RESULT: ${{ needs.publish_full_set.result }}
          EXPECTED_LATEST_TAG: ${{ needs.plan.outputs.release_tag }}
          PORT_RELEASE_TAG: x810-arch-build-${{ needs.publication_identity.outputs.run_id }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ "$PUBLISH_RESULT" == success ]]; then
            [[ -n "$latest_tag" && "$latest_tag" == "$EXPECTED_LATEST_TAG" ]] || {
              echo "REFUSING to prune: latest is '$latest_tag', expected complete release '$EXPECTED_LATEST_TAG'." >&2
              exit 1
            }
            asset_names="$(gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')"
            python3 - "$asset_names" <<'PY'
          import json
          import sys

          names = set(json.loads(sys.argv[1]))
          required = {"rootfs.tar.zst", "manifest.json", "SHA256SUMS", "update.zip"}
          missing = sorted(required - names)
          stale = sorted(names - required)
          if stale:
              raise SystemExit("REFUSING to prune: aggregate contains unexpected assets: " + ", ".join(stale))
          if missing:
              raise SystemExit("REFUSING to prune: latest aggregate is incomplete: " + ", ".join(missing))
          PY
            echo "Validated complete aggregate $latest_tag; removing every other release."
            tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
            while IFS= read -r tag; do
              [[ -n "$tag" && "$tag" != "$latest_tag" ]] || continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done <<< "$tags"
          else
            echo "Aggregate publication did not succeed; preserving the previous complete release set."
            if [[ "$EVENT_NAME" == push && "$PORT_RELEASE_TAG" != "$latest_tag" ]] && gh release view "$PORT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$PORT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          fi
