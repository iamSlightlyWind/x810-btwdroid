name: X810 Arch build and release

on:
  push:
    branches: [main]
    paths:
      - "PORT_VERSION"
      - "README.md"
      - "LICENSE"
      - "rootfs/**"
      - "docs/**"
      - "packages/**"
      - "tools/**"
      - ".gitignore"
      - ".github/workflows/x810-arch.yml"
  pull_request:
    paths:
      - "PORT_VERSION"
      - "README.md"
      - "LICENSE"
      - "rootfs/**"
      - "docs/**"
      - "packages/**"
      - "tools/**"
      - ".gitignore"
      - ".github/workflows/x810-arch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x810-arch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install archive verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd

      - name: Run installer, rootfs and package contract tests
        run: |
          set -euo pipefail
          bash -n tools/*.sh rootfs/*.sh
          python3 -m compileall -q tools
          python3 tools/test-x810-install.py
          python3 tools/test-target-pacman-policy.py
          python3 tools/test-rootfs-image-profile.py
          python3 tools/test-verify-rootfs-archive.py
          python3 tools/test-tab-companion-overlay.py

  build_release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      # Keep Podman runroot below old vfs-driver path limits; rootfs/build-rootfs.sh
      # also defaults to the short ignored paths under this repository's tmp/.
      PODMAN_RUNROOT_OVERRIDE: /tmp/x810-btwdroid-run
      X810_RELEASE_TAG: x810-arch-build-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman zstd gnupg cpio rpm
          command -v rpm2cpio

      - name: Build and audit the complete Arch GNOME rootfs
        run: rootfs/build-rootfs.sh

      - name: Publish one verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s out/rootfs.tar.zst
          test -s out/manifest.json
          test -s out/SHA256SUMS
          (cd out && sha256sum --check SHA256SUMS)
          gh release create "$X810_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Windstation Arch rootfs build $GITHUB_RUN_NUMBER" \
            --notes "Verified Arch Linux ARM GNOME/GDM rootfs for SM-X810. Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The installer downloads this release and verifies manifest.json before formatting linuxroot. No Android or boot partition is written." \
            --latest \
            out/rootfs.tar.zst out/manifest.json out/SHA256SUMS
